[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "npm-c2"
version = "2.0.0"
description = "Command channel over the npm staging API"
requires-python = ">=3.8"
dependencies = [
    "requests",
]

[project.scripts]
npm-c2 = "npm_c2.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
